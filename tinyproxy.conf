Port 8888
Listen 0.0.0.0
Timeout 600

# Only the app network may use the proxy
Allow 172.28.0.0/16

# Allowlist mode: deny everything not matching /etc/tinyproxy/filter
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterDefaultDeny Yes
FilterCaseSensitive Off

# Do not allow CONNECT to arbitrary ports
ConnectPort 443
